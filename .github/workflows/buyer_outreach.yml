name: Automated B2B Buyer Outreach

on:
  schedule:
    - cron: '*/30 14-20 * * 1-5'  # Automatically runs every 30 minutes during US/Eastern business hours (10 AM - 4 PM EDT), Mon-Fri
  workflow_dispatch:            # Allows you to manually trigger it with 1-click in GitHub UI

jobs:
  run-outreach:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # Allows GitHub Actions to push the updated sent logs back to your repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Run B2B Outreach Engine
      env:
        B2B_EMAIL: ${{ secrets.B2B_EMAIL }}
        B2B_APP_PASSWORD: ${{ secrets.B2B_APP_PASSWORD }}
      run: python buyer_email_engine.py

    - name: Commit and Push Sent Logs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Create file if it doesn't exist to prevent git error
        touch buyer_sent_emails.txt
        git add buyer_sent_emails.txt
        
        # Only commit and push if new B2B emails were actually sent (changes exist)
        if ! git diff --quiet buyer_sent_emails.txt; then
          git commit -m "b2b-outreach: update B2B sent email logs [skip ci]"
          git push
        else
          echo "No new B2B emails sent. Skipping commit."
        fi
